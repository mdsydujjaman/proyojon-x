<label style="font-weight:900;text-align:left;display:block;margin-top:8px">মোবাইল নম্বর</label>
<div class="input-3d">
<span class="prefix">+880</span>
<input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="1XXXXXXXXXX">
</div>

<button id="sendOtp" class="btn-3d orange">📲 OTP পাঠান</button>

<div id="otpSec" class="hide">
<p style="font-weight:900;text-align:left;margin-top:10px">OTP কোড (ডেমো: 123456)</p>
<div class="otp-boxes">
<input class="otp" inputmode="numeric" maxlength="1">
<input class="otp" inputmode="numeric" maxlength="1">
<input class="otp" inputmode="numeric" maxlength="1">
<input class="otp" inputmode="numeric" maxlength="1">
<input class="otp" inputmode="numeric" maxlength="1">
<input class="otp" inputmode="numeric" maxlength="1">
</div>
<button id="verifyOtp" class="btn-3d" style="background:#ffeb3b">OTP কনফার্ম করুন ✅</button>
<p id="otpMsg" class="msg"></p>
</div>

<label style="font-weight:900;text-align:left;display:block;margin-top:12px">লোকেশন (ঐচ্ছিক)</label>
<div class="input-3d">
<input id="location" type="text" placeholder="আপনার এলাকা">
<button id="locBtn" class="mini-3d">📍</button>
</div>

<button id="register" class="btn-3d green" disabled>রেজিস্ট্রেশন সম্পন্ন করুন</button>
<p id="msg" class="msg"></p>
<p style="font-size:11px;font-weight:700;color:#888;margin-top:10px">✅ ১০০% ফ্রি • নিরাপদ • OTP 123456</p>
</div>

<script>
let voiceOn=false, otpVerified=false, fail=0, cd=false;
const vb=document.getElementById('voiceBtn');
function speak(t){if(!voiceOn)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.rate=0.95;speechSynthesis.speak(u);}catch{}}
vb.onclick=()=>{voiceOn=!voiceOn;vb.textContent=voiceOn?'🔊 Voice: ON':'🔇 Voice: OFF';vb.style.background=voiceOn?'#b9f06a':'#fff';speak(voiceOn?'ভয়েস চালু, এখন প্রতিটি বাটন কথা বলবে':'ভয়েস বন্ধ');};

const mobile=document.getElementById('mobile'), send=document.getElementById('sendOtp'), otpSec=document.getElementById('otpSec'), otps=document.querySelectorAll('.otp'), verify=document.getElementById('verifyOtp'), otpMsg=document.getElementById('otpMsg'), loc=document.getElementById('location'), locBtn=document.getElementById('locBtn'), reg=document.getElementById('register'), msg=document.getElementById('msg');

mobile.addEventListener('input',()=>mobile.value=mobile.value.replace(/[^0-9]/g,'').slice(0,10));
mobile.addEventListener('focus',()=>speak('মোবাইল নম্বর লিখুন'));

send.onclick=()=>{
 if(cd)return;
 if(!/^1[3-9][0-9]{8}$/.test(mobile.value)){msg.textContent='সঠিক ১০ ডিজিট দিন';msg.style.color='red';speak('সঠিক নম্বর দিন');return;}
 otpSec.classList.remove('hide');msg.textContent='OTP 123456 পাঠানো হলো';msg.style.color='#0a8a2a';speak('OTP পাঠানো হয়েছে, ১২৩৪৫৬ লিখুন');otps[0].focus();
 cd=true;send.disabled=true;let c=30;let tm=setInterval(()=>{c--;send.textContent='আবার ('+c+'s)';if(c<=0){clearInterval(tm);cd=false;send.disabled=false;send.textContent='📲 OTP পাঠান';}},1000);
};

otps.forEach((o,i)=>{
 o.addEventListener('input',()=>{
  if(o.value.length>1){let p=o.value.replace(/[^0-9]/g,'').slice(0,6).split('');otps.forEach((x,j)=>x.value=p[j]||'');if(p.length===6)verify.focus();return;}
  if(o.value&&i<5)otps[i+1].focus();
 });
 o.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!o.value&&i>0)otps[i-1].focus();});
});

verify.onclick=()=>{
 let code=[...otps].map(x=>x.value).join('');
 if(code==='123456'){otpVerified=true;otpMsg.textContent='✅ ভেরিফাইড!';otpMsg.style.color='#0a8a2a';verify.textContent='✅ ভেরিফাইড';verify.disabled=true;reg.disabled=false;msg.textContent='এখন রেজিস্ট্রেশন সম্পন্ন করুন';speak('OTP সঠিক');}
 else{fail++;otpMsg.textContent='❌ ভুল! 123456 দিন ('+fail+'/3)';otpMsg.style.color='red';speak('ভুল OTP');if(fail>=3){verify.disabled=true;let c=60;let t=setInterval(()=>{c--;otpMsg.textContent='লক '+c+'s';if(c<=0){clearInterval(t);verify.disabled=false;fail=0;}},1000);}}
};

locBtn.onclick=()=>{
 speak('লোকেশন নেওয়া হচ্ছে');
 if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{loc.value=p.coords.latitude.toFixed(4)+','+p.coords.longitude.toFixed(4);msg.textContent='লোকেশন পাওয়া গেছে';},()=>loc.value='Mymensingh');}else loc.value='Mymensingh';
};

reg.onclick=()=>{
 if(!otpVerified){msg.textContent='আগে OTP কনফার্ম করুন!';msg.style.color='red';speak('OTP কনফার্ম করুন');return;}
 msg.textContent='✅ স্বাগতম ProyojonX এ!';msg.style.color='#0a8a2a';reg.textContent='সফল ✅';reg.disabled=true;speak('রেজিস্ট্রেশন সফল, স্বাগতম');
 setTimeout(()=>location.href='index.html',1200);
};
</script>
</body>
</html>
