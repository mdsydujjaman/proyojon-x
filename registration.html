<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ProyojonX - Step 1</title><link rel="stylesheet" href="registration.css"></head>
<body>
<div class="page-frame"></div>
<div class="top-wrap">
<div class="card-logo"><img src="logo-full.png" alt="ProyojonX" loading="lazy"><button id="voiceBtn" class="voice-pill">🔇 Voice: OFF</button></div>
</div>
<div class="card-reg">
<h2><span class="hl">রেজিস্ট্রেশন করুন</span></h2>
<p class="sub">কোটি মানুষের জন্য সহজ</p>

<label class="label">মোবাইল নম্বর</label>
<div class="input3d"><div class="pre">+880</div><input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="1XXXXXXXXXX" autocomplete="tel"></div>
<button id="sendOtp" class="btn3d orange">📲 OTP পাঠান</button>

<div id="otpSec" class="hide">
<p class="label" style="margin-top:14px">OTP কোড (ডেমো: 123456)</p>
<div class="otp-boxes"><input class="otp" inputmode="numeric" maxlength="1"><input class="otp" inputmode="numeric" maxlength="1"><input class="otp" inputmode="numeric" maxlength="1"><input class="otp" inputmode="numeric" maxlength="1"><input class="otp" inputmode="numeric" maxlength="1"><input class="otp" inputmode="numeric" maxlength="1"></div>
<button id="verifyOtp" class="btn3d yellow">OTP কনফার্ম করুন ✅</button>
<p id="otpMsg" class="msg"></p>
</div>

<label class="label" style="margin-top:14px">লোকেশন (ঐচ্ছিক)</label>
<div class="input3d"><input id="location" type="text" placeholder="আপনার এলাকা" autocomplete="off"><button id="locBtn" class="mini-3d">📍</button></div>

<button id="register" class="btn3d green" disabled>রেজিস্ট্রেশন সম্পন্ন করুন</button>
<p id="msg" class="msg"></p>
</div>
<script src="registration.js"></script>
</body>
</html>
