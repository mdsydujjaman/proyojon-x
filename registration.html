<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProyojonX</title><link rel="stylesheet" href="registration.css"></head><body>
<div class="page-frame"></div>
<button id="voiceBtn" class="voice-3d">🔇 Voice: OFF</button>
<div class="hero-full"><img src="https://i.ibb.co/6XQ6h3y/proyojonx-logo.png" onerror="this.src='data:image/svg+xml;base64,[STRIPPED]'" alt="ProyojonX"></div>
<div class="card-3d">
<h2><span>রেজিস্ট্রেশন করুন</span></h2>
<p class="sub">কোটি মানুষের জন্য সহজ</p>
<label class="label">মোবাইল নম্বর</label>
<div class="input-3d"><span class="prefix">+880</span><input id="mobile" type="tel" maxlength="10" placeholder="1XXXXXXXXXX"></div>
<button id="sendOtp" class="btn-3d orange">📲 OTP পাঠান</button>
<div id="otpSection"><label class="label">OTP কোড (ডেমো: 123456)</label><div class="otp-boxes"><input class="otp" maxlength="1"><input class="otp" maxlength="1"><input class="otp" maxlength="1"><input class="otp" maxlength="1"><input class="otp" maxlength="1"><input class="otp" maxlength="1"></div></div>
<label class="label">লোকেশন (ঐচ্ছিক)</label>
<div class="input-3d"><input id="location" type="text" placeholder="আপনার এলাকা"><button id="locBtn" class="mini-3d">📍</button></div>
<button id="register" class="btn-3d green">✅ রেজিস্ট্রেশন সম্পন্ন করুন</button>
<p id="msg" class="msg"></p>
<p style="font-size:10px;color:#888;margin-top:8px;font-weight:700">রেজিস্ট্রেশন করে আপনি আমাদের শর্তাবলী মেনে নিচ্ছেন</p>
</div>
<script src="registration.js"></script>
</body></html>
